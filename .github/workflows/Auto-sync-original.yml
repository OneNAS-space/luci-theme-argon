name: Auto sync and patch upstream repo
permissions:
  contents: write

on:
  schedule:
    - cron: '18 */2 * * *'
  workflow_dispatch:
  # Editing a patch re-runs the sync. The sync itself never touches patches/,
  # so its own pushes cannot re-trigger it.
  push:
    branches:
      - main
    paths:
      - 'patches/**'

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  UPSTREAM_URL: https://github.com/jerrykuku/luci-theme-argon.git
  UPSTREAM_BRANCH: master
  # Pristine upstream tree (without .github/), one commit per upstream change.
  OFFICIAL_BRANCH: official_channel
  # official_channel + patches/ applied + cascade.css rebuilt. This is what gets built.
  PATCHED_BRANCH: main
  # Same compiler as upstream's own CI, so unpatched output stays byte-identical.
  LESS_VERSION: 4.1.3

jobs:
  sync-and-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PATCHED_BRANCH }}
          token: ${{ secrets.TOKEN_ARGON }}
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "Jackie-Bot"
          git config --global user.email "jackie@actions.local"

      - name: Add upstream and fetch
        run: |
          set -e
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          echo "🔄 Fetching upstream $UPSTREAM_BRANCH..."
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

      - name: Update official_channel with the pristine upstream tree
        run: |
          set -e
          NEW_HASH=$(git rev-parse "upstream/$UPSTREAM_BRANCH")

          # 1. Switch to (or create) the official branch
          if git ls-remote --exit-code --heads origin "$OFFICIAL_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$OFFICIAL_BRANCH"
            git checkout -q -B "$OFFICIAL_BRANCH" "origin/$OFFICIAL_BRANCH"
            OLD_HASH=$(cat .upstream_meta 2>/dev/null || true)
          else
            echo "Creating a pristine orphan branch..."
            git checkout -q --orphan "$OFFICIAL_BRANCH"
            git rm -rf -q --cached . >/dev/null 2>&1 || true
            OLD_HASH=""
          fi

          # 2. Changelog: upstream commits since the last sync
          if [ -n "$OLD_HASH" ] && git cat-file -e "$OLD_HASH^{commit}" 2>/dev/null; then
            CHANGELOG=$(git log --oneline "$OLD_HASH..$NEW_HASH" | head -n 50)
          else
            CHANGELOG=""
          fi
          [ -z "$CHANGELOG" ] && CHANGELOG="No new upstream commits in this run (patches changed, or first sync)."

          {
            echo "Sync: upstream $(git rev-parse --short "$NEW_HASH")"
            echo ""
            echo "===== 📌 Upstream commits ====="
            echo "$CHANGELOG"
          } > "$RUNNER_TEMP/sync_msg.txt"

          # 3. Replace the work tree with upstream's. Upstream's own .github/
          #    (release/check workflows) must not run in this repository.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          git checkout "upstream/$UPSTREAM_BRANCH" -- .
          git rm -rf -q --cached .github 2>/dev/null || true
          rm -rf .github
          echo "$NEW_HASH" > .upstream_meta

          # 4. Commit only if something changed
          git add -A
          if git diff --cached --quiet; then
            echo "Perfect. No upstream updates detected."
          else
            git commit -q -m "$(cat "$RUNNER_TEMP/sync_msg.txt")"
            git push origin "$OFFICIAL_BRANCH"
          fi

      - name: Switch to main and overlay the pristine tree
        run: |
          set -e
          git checkout -q "$PATCHED_BRANCH"

          echo "🧹 Cleaning previously generated files in main..."
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'patches' \
            -exec rm -rf {} +

          echo "📥 Overlaying pristine upstream files from $OFFICIAL_BRANCH..."
          git checkout "$OFFICIAL_BRANCH" -- .
          # The sync marker belongs to the official branch only.
          git rm -f -q --cached .upstream_meta 2>/dev/null || true
          rm -f .upstream_meta

      - name: Apply custom patches
        run: |
          set -e
          shopt -s nullglob
          applied=0; skipped=0

          for p in patches/*.patch; do
            echo ""
            echo "🔎 $p"
            if patch -p1 --dry-run -R --silent < "$p" >/dev/null 2>&1; then
              echo "⏭️ [Skip] Already contained in the upstream source (or already applied)."
              skipped=$((skipped + 1))
              continue
            fi
            if patch -p1 --dry-run --silent < "$p" >/dev/null 2>&1; then
              patch --batch --no-backup-if-mismatch -p1 < "$p"
              echo "✅ Applied."
              applied=$((applied + 1))
            else
              echo "::error file=$p::$p is neither already in upstream nor does it apply cleanly. Regenerate it."
              exit 1
            fi
          done

          echo ""
          echo "Patches applied: $applied, skipped: $skipped"
          find . -name '*.orig' -not -path './.git/*' -delete

      # cascade.css is compiled from less/ (upstream CI compares them byte for
      # byte), so rebuild it after the LESS sources were patched.
      - name: Rebuild cascade.css from LESS
        run: |
          set -e
          npm install --global "less@${LESS_VERSION}"
          lessc less/cascade.less htdocs/luci-static/argon/css/cascade.css

      - name: Commit and push to main
        run: |
          set -e
          git add -A
          if git diff --cached --quiet; then
            echo "Genius! No modification changes detected on $PATCHED_BRANCH."
            exit 0
          fi
          git --no-pager diff --cached --stat | tail -n 15
          git commit -q -m "[Patched] $(cat "$RUNNER_TEMP/sync_msg.txt")"
          git push origin "$PATCHED_BRANCH"
